{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <h2 class="mb-4 text-center">👑 Admin Login</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            {{ form.email.label }}
            {{ form.email(class="form-control") }}
        </div>

        <div class="mb-3">
            {{ form.password.label }}
            {{ form.password(class="form-control") }}
        </div>
        <button type="submit" class="btn btn-danger w-100">
            Login as Admin
        </button>
    </form>
</div>

{% endblock %}
