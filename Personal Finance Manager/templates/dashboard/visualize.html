{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4 text-center">📊 Visualization Dashboard</h2>

<!-- BUTTONS -->
<div class="text-center mb-5">
    <button class="btn btn-dark m-2" onclick="showChart('pie')">Pie Chart</button>
    <button class="btn btn-primary m-2" onclick="showChart('bar')">Bar Chart</button>
    <button class="btn btn-warning m-2" onclick="showChart('doughnut')">Doughnut</button>
    <button class="btn btn-success m-2" onclick="showChart('summary')">Summary</button>
</div>

<!-- GRAPH AREA (more downward) -->
<div style="max-width:500px; margin: 80px auto 0;">
    <canvas id="chart" style="filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.2));"></canvas>
</div>

<!-- SUMMARY -->
<div id="summaryBox" class="mt-5" style="display:none;">
    <div class="row text-center">

        <div class="col-md-4">
            <div class="card bg-danger text-white p-3 shadow">
                <h5>Expense</h5>
                <h3>₹{{ expense }}</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white p-3 shadow">
                <h5>Remaining</h5>
                <h3>₹{{ balance }}</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-dark text-white p-3 shadow">
                <h5>Status</h5>

                {% if balance > 5000 %}
                    <h6 class="text-success">✅ Good Saving</h6>
                {% else %}
                    <h6 class="text-danger">⚠️ Low Balance</h6>
                {% endif %}

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let expense = {{ expense }};
let balance = {{ balance }};
let chart;

function showChart(type) {

    document.getElementById('summaryBox').style.display = "none";

    if (chart) chart.destroy();

    if (type === 'summary') {
        document.getElementById('summaryBox').style.display = "block";
        return;
    }

    chart = new Chart(document.getElementById('chart'), {
        type: type,
        data: {
            labels: ['Expense', 'Remaining'],
            datasets: [{
                data: [expense, balance],
                backgroundColor: ['#ff4d4d', '#28a745'],
                borderRadius: 5,
                hoverOffset: 20
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            animation: {
                duration: 1000,
                easing: 'easeOutQuart',
                animateScale: true,
                animateRotate: true
            },

            plugins: {
                legend: {
                    display: false   
                }
            },

            scales: type === 'bar' ? {
                x: {
                    grid: { display: false },
                    ticks: {
                        padding: 10
                    }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        padding: 15,
                        stepSize: Math.ceil((expense + balance) / 5)
                    }
                }
            } : {}
        }
    });
}

// default load
window.onload = function() {
    showChart('pie');
};
</script>

{% endblock %}
